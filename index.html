<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夜語島 Night Murmur Island (Cloud Online)</title>
<style>
:root{--ink:#3b2a33;--line:#5a3f4d;--paper:#fff8fb;--pink:#f6c9db;--pink2:#ec9fbf;--lav:#cdc6f4;--blue:#3f74d0;--rose:#d9488f;--sh:3px 3px 0 rgba(59,42,51,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#5ab4e5;color:var(--ink);font:14px/1.4 "PingFang HK","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
#tint{position:fixed;inset:0 0 34px 0;background:rgba(246,170,200,.16);pointer-events:none;opacity:0;transition:opacity .25s;z-index:5}
#tint.on{opacity:1}
.hidden{display:none!important}
/* windows */
.win{position:fixed;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;z-index:20;max-width:calc(100vw - 16px)}
.tbar{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;background:linear-gradient(90deg,var(--lav),var(--pink));border-bottom:2px solid var(--line);cursor:move;font-weight:700;font-size:13px;user-select:none;touch-action:none}
.tbar .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:22px;height:20px;border:2px solid var(--line);background:#fff;padding:0;line-height:14px;font-size:12px;cursor:pointer}
.btn{border:2px solid var(--line);background:#fff;padding:4px 12px;cursor:pointer;box-shadow:2px 2px 0 rgba(59,42,51,.3)}
.btn:active,.tbtn:active{transform:translate(1px,1px)}
.btn.pri{background:linear-gradient(#d6e4ff,#a9c4f5)}
.btn.pink{background:linear-gradient(#ffe3ee,#f6b9d1)}
.btn:disabled{opacity:.5;cursor:default}
.body{padding:12px}
label.f{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}
input.t,textarea.t,select.t{width:100%;border:2px solid var(--line);background:#fff;padding:5px 7px;outline:none}
textarea.t{resize:none;height:70px}
input.t:focus,textarea.t:focus{background:#fffdf0}
.err{color:#c0392b;font-size:12px;min-height:16px}
/* login */
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(#7fc6f2 0%,#bfe6fb 52%,#4aa6db 52%,#3f97cf 62%,#86cf62 62%,#6fbd4c 100%);overflow:hidden}
#login .float{position:absolute;color:rgba(255,255,255,.85);font-size:13px;white-space:nowrap;animation:drift linear infinite;text-shadow:0 1px 2px rgba(0,0,0,.15)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
#login .win{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:340px}
#login h1{margin:0 0 2px;font-size:20px;letter-spacing:2px}
#login .sub{font-size:12px;opacity:.7;margin-bottom:6px}
.seg{display:flex;border:2px solid var(--line)}
.seg button{flex:1;border:0;background:#fff;padding:5px;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:#ffe0ec;font-weight:700}
#animals{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);display:flex;gap:14px}
#animals canvas{width:44px;height:50px;image-rendering:pixelated;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
#animals canvas.on{transform:translateY(-8px) scale(1.15)}
/* hud */
#hud{position:fixed;left:8px;top:8px;z-index:10;display:flex;gap:6px;align-items:center}
.pill{background:rgba(255,248,251,.92);border:2px solid var(--line);padding:2px 9px;font-size:12px;font-weight:700;box-shadow:2px 2px 0 rgba(59,42,51,.25)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3cc46a;margin-right:5px}
#zoneBanner{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:11;background:rgba(255,248,251,.95);border:2px solid var(--line);padding:6px 18px;font-weight:700;font-size:16px;box-shadow:var(--sh);opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#zoneBanner small{display:block;font-weight:400;font-size:11px;opacity:.7}
#zoneBanner.on{opacity:1}
#icons{position:fixed;right:10px;top:10px;z-index:10;display:flex;flex-direction:column;gap:12px;align-items:center}
.icon{width:62px;text-align:center;font-size:11px;cursor:pointer;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);padding:3px 2px;border:1px dashed transparent}
.icon:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
.pxi{display:block;width:48px;height:48px;margin:0 auto 2px;image-rendering:pixelated;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.3));transition:transform .12s}
.icon:hover .pxi{transform:translateY(-2px) scale(1.06)}
#minimap{position:fixed;left:8px;bottom:44px;z-index:10;border:2px solid var(--line);background:#5ab4e5;image-rendering:pixelated;box-shadow:2px 2px 0 rgba(59,42,51,.25)}
#nearby{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:12;min-width:190px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);font-size:12px}
#nearby .tbar{cursor:default;font-size:11px;padding:2px 6px}
#nearby .nb{padding:6px 10px;display:flex;align-items:center;gap:8px;justify-content:center}
#hint{position:fixed;right:10px;bottom:44px;z-index:10;transition:opacity 1s}
#queue{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:12;font-size:12px;padding:6px 10px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex;gap:10px;align-items:center}
/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:30;background:#efe6ea;border-top:2px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px}
#startBtn{font-weight:700;padding:2px 10px}
#tabs{flex:1;display:flex;gap:4px;overflow:hidden}
.tab{display:flex;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;padding:1px 6px;font-size:12px;cursor:pointer;max-width:150px;white-space:nowrap}
.tab.act{background:#ffe0ec}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .bd{background:#e0457b;color:#fff;border-radius:8px;font-size:10px;padding:0 5px;font-weight:700}
.tab .x{opacity:.6;padding:0 2px}
.tab.ended .nm{text-decoration:line-through;opacity:.6}
#clock{border:2px inset #d9cdd3;padding:1px 8px;font-size:12px;background:#f7f1f4}
#startMenu{position:fixed;left:4px;bottom:36px;z-index:40;width:200px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex}
#startMenu .side{writing-mode:vertical-rl;transform:rotate(180deg);background:linear-gradient(var(--pink2),var(--lav));color:#fff;font-weight:700;padding:6px 3px;font-size:13px;letter-spacing:2px}
#startMenu .items{flex:1}
#startMenu .it{padding:7px 10px;cursor:pointer;font-size:13px}
#startMenu .it:hover{background:#ffe0ec}
/* chat */
.chatwin{width:320px;height:440px}
.heads{display:flex;border-bottom:2px solid var(--line)}
.hd{flex:1;display:flex;gap:6px;padding:6px;align-items:flex-start;min-width:0}
.hd.me{background:#fff6cf}.hd.them{background:#d9f3ea;border-left:2px solid var(--line)}
.hd canvas{width:33px;height:38px;image-rendering:pixelated;border:2px solid var(--line);background:#fff;flex:none}
.hd small{font-size:10px;opacity:.75;display:block}
.hd p{margin:0;font-size:12px;font-style:italic;word-break:break-all;line-height:1.25}
.on{color:#27a457;font-style:normal}.off{color:#999;font-style:normal}
.msgs{flex:1;overflow-y:auto;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;user-select:text}
.sys{text-align:center;font-size:11px;opacity:.6}
.mrow{display:flex;gap:6px;align-items:flex-end}
.mrow.mine{flex-direction:row-reverse}
.mrow canvas{width:22px;height:25px;image-rendering:pixelated;flex:none}
.bub{max-width:100%;width:fit-content;padding:4px 9px;border:2px solid var(--line);background:#e5f6ef;word-break:break-word;font-size:13px}
.mine .bub{background:#d8e6ff}
.bub.heart{border:0;background:none;font-size:30px;padding:0;animation:pop .5s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.mname{font-size:10px;opacity:.6;margin-bottom:1px}
.bar{display:flex;gap:4px;padding:6px;border-top:2px solid var(--line);background:#fde9f1}
.bar input{flex:1;min-width:0;border:2px solid var(--line);padding:4px 6px;outline:none}
.bar .hb{border:2px solid var(--line);background:#fff;cursor:pointer;padding:0 6px}
/* toasts */
#toasts{position:fixed;top:44px;right:10px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);padding:6px 12px;font-size:13px;animation:tin .25s;display:flex;gap:8px;align-items:center;max-width:300px}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
/* letters, wall */
.lwin{width:360px;height:440px}
.tabsrow{display:flex;border-bottom:2px solid var(--line)}
.tabsrow button{flex:1;border:0;background:#f4eef1;padding:6px;cursor:pointer;font-size:12px}
.tabsrow button.on{background:#fff;font-weight:700}
.tabsrow button+button{border-left:2px solid var(--line)}
.scroll{flex:1;overflow-y:auto;background:#fff}
.li{padding:8px 10px;border-bottom:1px dashed #d8c6cf;cursor:pointer}
.li:hover{background:#fff4f8}
.li .meta{font-size:11px;opacity:.6}
.li.unread .meta:before{content:"● ";color:#e0457b}
.post{margin:8px;padding:8px 10px;background:#fff9c9;border:2px solid var(--line);box-shadow:2px 2px 0 rgba(59,42,51,.2);font-size:13px}
.post:nth-child(3n+2){background:#d9f3ea;transform:rotate(.6deg)}.post:nth-child(3n){background:#ffe0ec;transform:rotate(-.6deg)}
.post .meta{font-size:11px;opacity:.6;margin-top:3px}
.cnt{font-size:11px;opacity:.6;text-align:right}
/* dpad */
#dpad{position:fixed;left:14px;bottom:52px;z-index:15;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px;opacity:.75}
#dpad button{border:2px solid var(--line);background:rgba(255,248,251,.85);font-size:18px;touch-action:none}
.modal{z-index:70}
#raceHud{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:12;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);padding:6px 12px;font-size:12px;min-width:280px;text-align:center}
#raceHud ol{margin:5px 0;padding:0;list-style:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#raceHud li{border:1.5px solid var(--line);padding:0 6px;background:#fff}
#raceHud li.me{background:#ffe0ec;font-weight:700}
.rh-hint{opacity:.65;font-size:11px}
#bigText{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:45;font-size:76px;font-weight:900;color:#d9488f;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(59,42,51,.3);pointer-events:none;animation:pop .4s}
#ceremony{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:41;background:linear-gradient(#fff8e1,#ffe9f2);border:3px solid var(--line);box-shadow:var(--sh);padding:10px 18px;min-width:320px;max-width:calc(100vw - 20px)}
.cer-t{font-weight:900;font-size:17px;text-align:center;margin-bottom:6px;letter-spacing:1px}
.cer-row{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px;flex-wrap:wrap}
.cer-row .md{font-size:22px}
.cer-row .pr{opacity:.75;font-size:12px}
.cer-row.r1 b{font-size:17px;color:#b07800}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tint"></div>

<!-- LOGIN -->
<div id="login">
  <div class="win">
    <div class="tbar" style="cursor:default"><span class="ti">✦ 夜語島 · 雲端連線版</span></div>
    <div class="body">
      <h1>夜語島</h1>
      <div class="sub">Night Murmur Island · Cloud Server Sync</div>
      <label class="f">名稱 Name</label>
      <input class="t" id="inName" maxlength="20" placeholder="最多8個中文字 / 20個英文字">
      <label class="f">此刻諗緊… What's on your mind</label>
      <textarea class="t" id="inThought" maxlength="40" placeholder="有咩想同陌生人講？"></textarea>

      <select class="t" id="inZone"><option value="hub">🏁 中央廣場</option><option value="bkk">🛕 曼谷 Bangkok</option><option value="pus">🌊 釜山 Busan</option><option value="tyo">⛩️ 東京 Tokyo</option><option value="han">🏮 河內 Hanoi</option></select>

    </div>

</div>

<!-- HUD -->
<div id="hud" class="hidden"><span class="pill"><span class="dot"></span><span id="pcount">-</span></span><span class="pill" id="zonePill">-</span><span class="pill" id="netPill">☁️ Google Cloud</span></div>
<div id="zoneBanner"></div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* ================= Firebase & Cloud Init ================= */
const appId = typeof __app_id !== 'undefined' ? __app_id : 'night-island-cloud';
const firebaseConfig = typeof __firebase_config !== 'undefined' 
  ? JSON.parse(__firebase_config) 
  : {
      apiKey: "AIzaSyDemoPlaceholderOnly",
      authDomain: "demo.firebaseapp.com",
      projectId: "demo-app",
      storageBucket: "demo.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:demo"
    };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.CloudNet = {
  db,
  auth,
  appId,
  user: null,
  async init() {
    try {
      if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }
      this.user = auth.currentUser;
      this.bindCloudSync();
    } catch(e) {
      console.warn("Cloud Auth running in fallback local mode:", e);
    }
  },
  bindCloudSync() {
    if(!this.user) return;
    const playersCol = collection(db, 'artifacts', appId, 'public', 'data', 'players');
    onSnapshot(playersCol, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const data = change.doc.data();
        if(!data || data.id === me?.id) return;
        if (change.type === "removed") {
          window.onNet({ t: 'leave', from: change.doc.id });
        } else {
          window.onState({ ...data, from: data.id });
        }
      });
    }, (err) => console.error("Players sync error", err));

    const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
    onSnapshot(messagesCol, (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        if (change.type === "added") {
          const m = change.doc.data();
          if (m && m.to === me?.id) {
            window.onNet(m);
          }
        }
      });
    }, (err) => console.error("Messages sync error", err));

    const wallCol = collection(db, 'artifacts', appId, 'public', 'data', 'wall');
    onSnapshot(wallCol, (snapshot) => {
      const list = [];
      snapshot.forEach(doc => list.push(doc.data()));
      if (list.length) {
        window.wall = list.sort((a,b) => b.time - a.time);
        if (window.wallWin) window.renderWall();
      }
    }, (err) => console.error("Wall sync error", err));
  },
  async updateState(st) {
    if (!this.user || !me) return;
    try {
      const playerDoc = doc(db, 'artifacts', appId, 'public', 'data', 'players', me.id);
      await setDoc(playerDoc, { ...st, lastSeen: Date.now() });
    } catch(e){}
  },
  async sendMessage(msg) {
    if (!this.user || !me) return;
    try {
      const messagesCol = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
      await addDoc(messagesCol, { ...msg, timestamp: Date.now() });
    } catch(e){}
  },
  async postWall(post) {
    if (!this.user || !me) return;
    try {
      const wallCol = collection(db, 'artifacts', appId, 'public', 'data', 'wall');
      await addDoc(wallCol, post);
    } catch(e){}
  },
  async leave() {
    if (!this.user || !me) return;
    try {
      const playerDoc = doc(db, 'artifacts', appId, 'public', 'data', 'players', me.id);
      await deleteDoc(playerDoc);
    } catch(e){}
  }
};

window.CloudNet.init();
</script>

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,(a,b,cw,ch,col)=>{x.fillStyle=col;x.fillRect(a|0,b|0,cw|0,ch|0)});return c}

const clean=(v,n)=>String(v==null?'':v).replace(/[\u0000-\u001f]/g,'').slice(0,n);

window.onState = function(m) {
  const id=clean(m.from||m.id,40);if(!id||!me||id===me.id)return;
  const x=+m.x,y=+m.y;if(!isFinite(x)||!isFinite(y))return;
  let r=remotes.get(id);if(!r){r={id,kind:'remote',alpha:0,anim:0,x,y};remotes.set(id,r)}
  if(Math.hypot(r.x-x,r.y-y)>140){r.x=x;r.y=y}
  Object.assign(r,{name:clean(m.name,20)||'旅人',thought:clean(m.thought,40),gender:m.gender==='f'?'f':'m',animal:AKEYS.includes(m.animal)?m.animal:'bear',tx:x,ty:y,dir:m.dir<0?-1:1,moving:!!m.moving,podium:[1,2,3].includes(m.pod)?m.pod:0,medal:['🥇','🥈','🥉'].includes(m.medal)?m.medal:'',slipping:!!m.slip,racing:!!m.racing,q:+m.q||0,seen:performance.now()});
  const c=chats.get(r.id);if(c)updateChatHead(c);
};

window.onNet = function(m) {
  if(!inWorld||!me||!m||typeof m!=='object')return;
  const from=clean(m.from,40);if(!from||from===me.id)return;
  const r=remotes.get(from);
  switch(m.t){
    case'leave':if(r){remotes.delete(from);const c=chats.get(from);if(c)endChat(c,'— 佢已經離開咗島 —')}break;
    case'req':if(!r||chats.has(r.id))return;if(openCount()>=cap())return;const c=openChat(r,{incoming:true});if(c)notifyIncoming(c);break;
    case'msg':{if(!r)return;let c=chats.get(r.id);if(!c){if(openCount()>=cap())return;c=openChat(r,{incoming:true});if(!c)return;notifyIncoming(c)}addMsg(c,'them',clean(m.text,200));break}
    case'close':{const c=chats.get(from);if(c)endChat(c,'— 對方已離開對話 —')}break;
    case'rstart':onRaceStart(m);break;
  }
};

const PODSPOT=[null,{x:PODIUM.x,y:PODIUM.y-26},{x:PODIUM.x-24,y:PODIUM.y-18},{x:PODIUM.x+24,y:PODIUM.y-12}];

const GOAL=[MAZE.ex,MAZE.y0-1],START=[MAZE.ex,MAZE.y0+MAZE.H-2];
const TRAM={x:30*T,y:40.9*T,dir:1,wait:60},TRAM_SPR=S.tram();

function drawPods(p){for(let i=0;i<5;i++){const off=(i*64+PODS.t*.35)%(p.w-14);ctx.drawImage(POD_SPR[i],Math.round(p.x+off),p.y+8-12)}}
const TRAIN={x:84*T,y:37*T+13,active:false,wait:900},TRAIN_SPR=S.trainV();
function updateTrain(dt){PODS.t+=dt;if(!TRAIN.active){TRAIN.wait-=dt;if(TRAIN.wait<=0){TRAIN.active=true;TRAIN.x=84*T}return}
 TRAIN.x-=1.15*dt;if(TRAIN.x+152<54*T){TRAIN.active=false;TRAIN.wait=rand(1800,3200)}
 if(inWorld&&me&&!me.racing&&Math.floor(me.y/T)===37&&me.x>TRAIN.x-8&&me.x<TRAIN.x+160){me.y=38.8*T;me.vy=1.2;toast('😱 小心火車！')}}

const mazeOpen=(x,y)=>gt(x,y)===14||(x===GOAL[0]&&y===GOAL[1]);
function bfsFrom(gx,gy){const d=new Map([[gx+','+gy,0]]),q=[[gx,gy]];while(q.length){const[x,y]=q.shift();const k=d.get(x+','+y);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,key=a+','+b;if(!d.has(key)&&mazeOpen(a,b)){d.set(key,k+1);q.push([a,b])}}}return d}
function pathTo(sx,sy,gx,gy){const d=bfsFrom(gx,gy);if(!d.has(sx+','+sy))return[];const path=[];let x=sx,y=sy,k=d.get(x+','+y);while(k>0){for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const kk=d.get((x+dx)+','+(y+dy));if(kk===k-1){x+=dx;y+=dy;k=kk;path.push([x,y]);break}}}return path}
function inQueue(e){return race.queue.includes(e)}

function joinQueue(){if(race.st){toast('比賽進行緊，完咗先再排');return}if(inQueue(me))return;
 race.queue.push(me);me.q=Date.now();updateQueue();toast('🌀 已排隊迷宮賽跑！');botFill();checkQueue()}
function leaveQueue(){race.queue=race.queue.filter(e=>e!==me);if(me)me.q=0;updateQueue()}
function botJoinQueue(b){if(race.st||inQueue(b))return;race.queue.push(b);updateQueue();checkQueue()}
function botFill(){if(!inQueue(me)||race.st)return;
 setTimeout(()=>{if(!inQueue(me)||race.st)return;
  if(race.queue.length<4){const cand=bots.filter(b=>!inQueue(b));if(cand.length)botJoinQueue(pick(cand))}
 },2000)}
function updateQueue(){const q=$('#queue');if(!me||!inQueue(me)||race.st){q.classList.add('hidden');return}q.classList.remove('hidden');
 const n=race.queue.length;q.innerHTML=`<span>🌀 排隊中：<b>${n}/4</b></span>${n>=2?'<button class="btn pink go" style="padding:1px 8px">立即開始</button>':''}<button class="btn lv" style="padding:1px 8px">離開隊伍</button>`;
 $('.lv',q).onclick=leaveQueue;const g=$('.go',q);if(g)g.onclick=()=>startRace(race.queue.slice(0,4))}
function checkQueue(){if(race.queue.length>=4&&inQueue(me)&&!race.st){startRace(race.queue.slice(0,4))}}

function big(t,ms=850){const b=$('#bigText');b.textContent=t;b.classList.remove('hidden');clearTimeout(b._t);b._t=setTimeout(()=>b.classList.add('hidden'),ms)}
function startRace(ents){if(race.st||!ents||ents.length<2)return;const seed=(Math.random()*1e9)|0;me.q=0;race.queue=[];updateQueue();
 makeMaze(seed);repaint(MAZE.x0-1,MAZE.y0-1,MAZE.x0+MAZE.W,MAZE.y0+MAZE.H);renderMM();
 const dist=bfsFrom(GOAL[0],GOAL[1]);
 race.st={phase:'count',t:3,time:0,finish:[],dist,
  racers:ents.map((e,i)=>{
   return{e,me:e===me,remote:e.kind==='remote',top:rand(1.15,1.45),legs:[GOAL],path:[],done:false}})};
 race.st.racers.forEach((r,i)=>{if(r.remote)return;r.e.x=START[0]*T+8+(i-1.5)*3.5;r.e.y=START[1]*T+11;r.e.racing=true});
 $('#raceHud').classList.remove('hidden');renderRaceHud();big('3');
 if(window.CloudNet) window.CloudNet.sendMessage({ t:'rstart', seed, ids:ents.map(x=>x.id) });
}
function onRaceStart(m){
 if(race.st) return;
 const ids=m.ids||[];const ents=ids.map(id=>id===me.id?me:remotes.get(id)).filter(Boolean);if(ents.length<2)return;
 makeMaze(m.seed);repaint(MAZE.x0-1,MAZE.y0-1,MAZE.x0+MAZE.W,MAZE.y0+MAZE.H);renderMM();
 const dist=bfsFrom(GOAL[0],GOAL[1]);
 race.st={phase:'count',t:3,time:0,finish:[],dist,racers:ents.map(e=>({e,me:e===me,remote:e.kind==='remote',top:1.3,legs:[GOAL],path:[],done:false}))};
 $('#raceHud').classList.remove('hidden');renderRaceHud();big('3');
}
function botStep(r,dt){const e=r.e;
 if(!r.path.length){const c=tileOf(e);r.path=pathTo(c[0],c[1],GOAL[0],GOAL[1]);if(!r.path.length){e.moving=false;return}}
 const[tx,ty]=r.path[0];const gx=tx*T+8,gy=ty*T+11,dx=gx-e.x,dy=gy-e.y,d=Math.hypot(dx,dy),sp=r.top*dt;
 if(d<=sp){e.x=gx;e.y=gy;r.path.shift()}else{e.x+=dx/d*sp;e.y+=dy/d*sp}
 e.moving=true;e.anim+=dt}
function stepsLeft(r){if(r.done)return 0;const[x,y]=tileOf(r.e);const d=race.st.dist.get(x+','+y);return d==null?999:d}
function standings(){return race.st.racers.slice().sort((a,b)=>(a.done&&b.done)?a.rank-b.rank:a.done?-1:b.done?1:stepsLeft(a)-stepsLeft(b))}
function renderRaceHud(){const s=race.st,st=standings();
 $('#raceHud').innerHTML=`<div>🌀 <b>夜語島盃 · 迷宮賽跑</b></div><ol>${st.map((r,i)=>`<li class="${r.me?'me':''}">${i+1}. ${esc(r.e.name)} ${r.done?'🏁':`<small>${stepsLeft(r)}步</small>`}</li>`).join('')}</ol>`}
function updateRace(dt){const s=race.st;if(!s)return;
 if(s.phase==='count'){s.t-=dt/60;if(s.t<=0){big('開始！');s.phase='run'}return}
 if(s.phase==='run'){s.time+=dt/60;
  for(const r of s.racers){const e=r.e;if(r.remote)continue;
   if(r.done)continue;
   if(!r.me)botStep(r,dt);
   if(e.y<MAZE.y0*T-1){r.done=true;s.finish.push(r);r.rank=s.finish.length;if(r.me)big(`第 ${r.rank} 名！`)}
  }
  renderRaceHud();
  if(s.racers.every(r=>r.done||r.remote))startCeremony();return}
 if(s.phase==='ceremony'){s.t-=dt/60;if(s.t<=0)endCeremony()}}
function startCeremony(){const s=race.st;s.phase='ceremony';s.t=8;$('#raceHud').classList.add('hidden');
 const top=standings().slice(0,3);
 $('#ceremony').innerHTML=`<div class="cer-t">🏆 頒獎典禮</div>`+top.map((r,i)=>`<div class="cer-row r${i+1}"><span class="md">${PRAISE[i][0]}</span><b>${esc(r.e.name)}</b></div>`).join('');
 $('#ceremony').classList.remove('hidden')}
function endCeremony(){$('#ceremony').classList.add('hidden');race.st=null}

/* ================= input & controls ================= */
const ARROWS={ArrowUp:1,ArrowDown:1,ArrowLeft:1,ArrowRight:1};
const isTyping=t=>t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT');
addEventListener('keydown',e=>{if(!inWorld)return;const k=e.key;
 if(ARROWS[k]){held.add(k);e.preventDefault();return}
 const typing=isTyping(e.target);
 if(!typing&&k==='Enter'&&nearTarget){doNearAction();e.preventDefault()}});
addEventListener('keyup',e=>held.delete(e.key));
addEventListener('blur',()=>held.clear());
$('#dpad').querySelectorAll('button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='Enter'){if(nearTarget)doNearAction();return}held.add(k)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>held.delete(k)))});

$('#game').addEventListener('pointerdown',e=>{if(!inWorld)return;const wx=e.clientX/Zcur+camX,wy=e.clientY/Zcur+camY;let best=null,bd=16;for(const p of allPeople()){if(p===me)continue;const d=Math.hypot(p.x-wx,p.y-12-wy);if(d<bd){bd=d;best=p}}if(best){const dist=Math.hypot(best.x-me.x,best.y-me.y);if(dist<48){openChat(best)}else toast(`${esc(best.name)} 「${esc(best.thought)}」<br><small>行近啲先可以連接</small>`)}else{me.clickT={x:wx,y:wy}}});

$('#startBtn').onclick=e=>{e.stopPropagation();$('#startMenu').classList.toggle('hidden')};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#startMenu')&&e.target.id!=='startBtn')$('#startMenu').classList.add('hidden')});
$('#startMenu').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;$('#startMenu').classList.add('hidden');
 if(a==='thought')promptBox('💭 改想法','此刻諗緊…',me.thought,40,v=>{me.thought=v;broadcastState();toast('🔄 已更新想法！')});
 if(a==='letters')openLetters('in');if(a==='wall')openWall();if(a==='race')joinQueue();
 if(a==='sound'){soundOn=!soundOn;store.set('ni_sound',soundOn);toast(soundOn?'🔊 已開聲':'🔈 已靜音')}
 if(a==='tp')teleportMenu();
 if(a==='online'){const w=makeWin('modal','🌐 雲端線上連線',340);w.style.zIndex=999;$('.mn',w).remove();$('.cl',w).onclick=()=>w.remove();w.appendChild(el('div','body',`<p>✅ 你目前透過 <b>Google Cloud (Firebase)</b> 即時雲端連線中！</p><p style="font-size:12px">只需複製此網頁網址傳給朋友，大家即可在同一島嶼上即時移動、發送留言與賽跑。</p>`))}
 if(a==='leave')confirmBox('離開島嶼？','離開',leaveWorld)});

function teleportMenu(){const w=makeWin('modal','🧭 傳送',260);w.style.width='260px';w.style.zIndex=999;$('.mn',w).remove();$('.cl',w).onclick=()=>w.remove();const b=el('div','body');['hub','bkk','pus','tyo','han'].forEach(z=>{const bt=el('button','btn',`${ZONES[z].icon} ${ZONES[z].name}`);bt.style.cssText='display:block;width:100%;margin:4px 0;text-align:left';bt.onclick=()=>{const p=z==='hub'?randomSpotNear(SPAWN.x,SPAWN.y):randomSpot(z);me.x=p.x;me.y=p.y;w.remove()};b.appendChild(bt)});w.appendChild(b)}

(function drawIcons(){const D='#3b2333';document.querySelectorAll('canvas.pxi').forEach(cv=>{const x=cv.getContext('2d');const r=(a,b,w,h,c)=>{x.fillStyle=c;x.fillRect(a,b,w,h)};const k=cv.dataset.i;
 if(k==='letter'){r(2,6,20,14,D);r(3,7,18,12,'#ffe3ee')}
 if(k==='wall'){r(1,3,22,18,D);r(2,4,20,16,'#9a6a3c')}
 if(k==='maze'){r(1,1,22,22,D);r(2,2,20,20,'#e4d8bd')}
 if(k==='globe'){r(2,2,20,20,'#5ab4e5')}
 })})();
$('#icTp').onclick=()=>teleportMenu();$('#icLetters').onclick=()=>openLetters('in');$('#icWall').onclick=openWall;$('#icRace').onclick=joinQueue;

function leaveWorld(){
 if(window.CloudNet) window.CloudNet.leave();
 remotes.clear();inWorld=false;
 ['#hud','#icons','#minimap','#nearby','#taskbar','#hint','#queue','#dpad'].forEach(s=>$(s).classList.add('hidden'));document.querySelectorAll('.win').forEach(w=>{if(!w.closest('#login'))w.remove()});$('#login').classList.remove('hidden')}

/* ================= loop update & render ================= */
let nearTarget=null;
function updateNearby(){const nb=$('#nbBody');let best=null,bd=46;
 for(const p of allPeople()){if(p===me||p.alpha<1)continue;const d=Math.hypot(p.x-me.x,p.y-me.y);if(d<bd){bd=d;best=p}}
 let poi=null;if(!best)for(const q of POI){if(Math.hypot(q.x-me.x,q.y-me.y)<40){poi=q;break}}
 nearTarget=best?{p:best}:poi?{q:poi}:null;
 if(best){const has=chats.has(best.id);nb.innerHTML=`<span><b>${esc(best.name)}</b> 就喺附近</span><button class="btn pink" style="padding:1px 10px">${has?'打開對話':'連接'}</button>`;$('button',nb).onclick=doNearAction}
 else if(poi){nb.innerHTML=`<span>${poi.label}</span><button class="btn pri" style="padding:1px 10px">開啟</button>`;$('button',nb).onclick=doNearAction}
 else nb.innerHTML='<span style="opacity:.7">再行近啲…</span>'}
function doNearAction(){if(!nearTarget)return;if(nearTarget.p)openChat(nearTarget.p);else{const t=nearTarget.q.type;if(t==='mail')openLetters('in');else if(t==='wall')openWall();else if(t==='race')joinQueue()}}

function moveEnt(e,dx,dy){let moved=false;
 if(dx){if(walkable(e.x+dx,e.y)){e.x+=dx;moved=true}}
 if(dy){if(walkable(e.x,e.y+dy)){e.y+=dy;moved=true}}
 return moved}
function update(dt){
 let dx=0,dy=0;if(held.has('ArrowLeft'))dx--;if(held.has('ArrowRight'))dx++;if(held.has('ArrowUp'))dy--;if(held.has('ArrowDown'))dy++;
 if(me.clickT&&!dx&&!dy){const ddx=me.clickT.x-me.x,ddy=me.clickT.y-me.y,d=Math.hypot(ddx,ddy);if(d<3)me.clickT=null;else{dx=ddx/d;dy=ddy/d}}else if(dx||dy)me.clickT=null;
 if(dx||dy){const l=Math.hypot(dx,dy);const speed=1.75*dt;const ok=moveEnt(me,dx/l*speed,dy/l*speed);me.moving=ok;if(dx)me.dir=dx<0?-1:1;me.anim+=dt}else me.moving=false;
 
 const z=zoneAt(me.x,me.y);if(z!==lastZone){lastZone=z;const Zn=ZONES[z];$('#zonePill').textContent=Zn.icon+' '+Zn.name;const bn=$('#zoneBanner');bn.innerHTML=`${Zn.icon} ${Zn.name}<small>${Zn.sub}</small>`;bn.classList.add('on');clearTimeout(bn._t);bn._t=setTimeout(()=>bn.classList.remove('on'),2600)}
 for(const b of bots){if(b.wait>0){b.wait-=dt;continue}const ddx=b.tx-b.x,ddy=b.ty-b.y,d=Math.hypot(ddx,ddy);if(d<2){const p=randomSpot(b.home);b.tx=p.x;b.ty=p.y;b.wait=rand(100,300);continue}moveEnt(b,ddx/d*.75*dt,ddy/d*.75*dt);b.anim+=dt;b.alpha=Math.min(1,b.alpha+.05)}
 const now=performance.now();
 for(const[id,r]of remotes){
   if(now-r.seen>10000){remotes.delete(id);continue}
   r.alpha=Math.min(1,(r.alpha||0)+.05*dt);
   r.x+=(r.tx-r.x)*.2;r.y+=(r.ty-r.y)*.2;
 }
 updateTrain(dt);updateRace(dt);updateNearby();
}

const cv=$('#game'),ctx=cv.getContext('2d');const mm=$('#minimap'),mctx=mm.getContext('2d');
function resize(){dpr=window.devicePixelRatio||1;cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;Z=innerWidth<720?2:3}
addEventListener('resize',resize);resize();
const MMBG=document.createElement('canvas');MMBG.width=MW*2;MMBG.height=MH*2;
function renderMM(){const c=MMBG.getContext('2d');const col={0:'#5ab4e5',1:'#8fcf6a',2:'#e6bd8e',3:'#d99b6c',4:'#5cc0e8',5:'#a8743f',6:'#f3dfa8',7:'#cdc9c4',8:'#d98f62',9:'#8a93a0',10:'#8a7a6a',11:'#c8383b',12:'#5d646e',13:'#2c6e36',14:'#e4d8bd',15:'#e4d8bd'};for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){c.fillStyle=col[gt(x,y)];c.fillRect(x*2,y*2,2,2)}}
renderMM();

function bubble(x,y,text,o){ctx.font=`12px sans-serif`;let t=text.length>16?text.slice(0,15)+'…':text;const w=ctx.measureText(t).width+16,h=22;const bx=Math.round(x-w/2),by=Math.round(y-h);
 ctx.fillStyle='rgba(59,42,51,.25)';ctx.fillRect(bx+2,by+2,w,h);ctx.fillStyle=o.bg||'#fff';ctx.fillRect(bx,by,w,h);ctx.strokeStyle='#3b2a33';ctx.lineWidth=1.5;ctx.strokeRect(bx+.5,by+.5,w-1,h-1);
 ctx.fillStyle='#3b2a33';ctx.fillText(t,bx+8,by+h-7)}

function draw(){
 const Z=Zcur;const vw=innerWidth/Z,vh=innerHeight/Z;
 camX=Math.max(0,Math.min(WW-vw,me.x-vw/2));camY=Math.max(0,Math.min(WH-vh,me.y-vh/2));
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#5ab4e5';ctx.fillRect(0,0,cv.width,cv.height);
 const s=Z*dpr;ctx.setTransform(s,0,0,s,-camX*s,-camY*s);ctx.imageSmoothingEnabled=false;
 ctx.drawImage(BG,0,0);
 const vis=[];
 for(const p of props)vis.push({y:p.sy,p});
 for(const e of allPeople())vis.push({y:e.y,e});
 vis.sort((a,b)=>a.y-b.y);
 for(const v of vis){if(v.p)ctx.drawImage(v.p.spr,v.p.x,v.p.y);else if(v.e){const e=v.e;ctx.globalAlpha=e.alpha??1;
  const fr=e.moving?[1,0,3,0][Math.floor(e.anim/6)%4]:0;ctx.save();ctx.translate(Math.round(e.x),Math.round(e.y));if(e.dir<0)ctx.scale(-1,1);
  ctx.drawImage(SPR[e.animal]?SPR[e.animal][fr]:SPR['bear'][0],-11,-24);ctx.restore();ctx.globalAlpha=1}}
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;
 for(const e of allPeople()){const sx=(e.x-camX)*Z,sy=(e.y-camY)*Z;bubble(sx,sy-26*Z,e.thought,{bg:e===me?'#ffe4ef':'#fff'});
  ctx.font='bold 10px sans-serif';const nm=e.name;const nw=ctx.measureText(nm).width+8;ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(sx-nw/2,sy+4,nw,13);ctx.fillStyle='#3b2a33';ctx.fillText(nm,sx-nw/2+4,sy+14)}
 mctx.drawImage(MMBG,0,0,MW*2,MH*2,0,0,168,120);
 const k=168/WW;mctx.fillStyle='#e0457b';mctx.fillRect(me.x*k-2,me.y*(120/WH)-2,4,4);
 $('#pcount').textContent=`${1+remotes.size} 真人在線 · ${bots.length} 電腦`;
}
setInterval(()=>{$('#clock').textContent=hhmm(new Date())},1000);
let last=performance.now();
function loop(now){const dt=Math.min(6,(now-last)/16.67);last=now;if(inWorld&&me){update(dt);draw()}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
