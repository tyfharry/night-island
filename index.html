<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>夜語島 Night Murmur Island</title>
<style>
:root{--ink:#3b2a33;--line:#5a3f4d;--paper:#fff8fb;--pink:#f6c9db;--pink2:#ec9fbf;--lav:#cdc6f4;--blue:#3f74d0;--rose:#d9488f;--sh:3px 3px 0 rgba(59,42,51,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#5ab4e5;color:var(--ink);font:14px/1.4 "PingFang HK","Microsoft JhengHei","Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
#game{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;image-rendering:pixelated}
#tint{position:fixed;inset:0 0 34px 0;background:rgba(246,170,200,.16);pointer-events:none;opacity:0;transition:opacity .25s;z-index:5}
#tint.on{opacity:1}
.hidden{display:none!important}
/* windows */
.win{position:fixed;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;z-index:20;max-width:calc(100vw - 16px)}
.tbar{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;background:linear-gradient(90deg,var(--lav),var(--pink));border-bottom:2px solid var(--line);cursor:move;font-weight:700;font-size:13px;user-select:none;touch-action:none}
.tbar .ti{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:22px;height:20px;border:2px solid var(--line);background:#fff;padding:0;line-height:14px;font-size:12px;cursor:pointer}
.btn{border:2px solid var(--line);background:#fff;padding:4px 12px;cursor:pointer;box-shadow:2px 2px 0 rgba(59,42,51,.3)}
.btn:active,.tbtn:active{transform:translate(1px,1px)}
.btn.pri{background:linear-gradient(#d6e4ff,#a9c4f5)}
.btn.pink{background:linear-gradient(#ffe3ee,#f6b9d1)}
.btn:disabled{opacity:.5;cursor:default}
.body{padding:12px}
label.f{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}
input.t,textarea.t,select.t{width:100%;border:2px solid var(--line);background:#fff;padding:5px 7px;outline:none}
textarea.t{resize:none;height:70px}
input.t:focus,textarea.t:focus{background:#fffdf0}
.err{color:#c0392b;font-size:12px;min-height:16px}
/* login */
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(#7fc6f2 0%,#bfe6fb 52%,#4aa6db 52%,#3f97cf 62%,#86cf62 62%,#6fbd4c 100%);overflow:hidden}
#login .float{position:absolute;color:rgba(255,255,255,.85);font-size:13px;white-space:nowrap;animation:drift linear infinite;text-shadow:0 1px 2px rgba(0,0,0,.15)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
#login .win{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:340px}
#login h1{margin:0 0 2px;font-size:20px;letter-spacing:2px}
#login .sub{font-size:12px;opacity:.7;margin-bottom:6px}
.seg{display:flex;border:2px solid var(--line)}
.seg button{flex:1;border:0;background:#fff;padding:5px;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button.on{background:#ffe0ec;font-weight:700}
#animals{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);display:flex;gap:14px}
#animals canvas{width:44px;height:50px;image-rendering:pixelated;cursor:pointer;transition:transform .15s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
#animals canvas.on{transform:translateY(-8px) scale(1.15)}
.foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:11px;color:#fff;opacity:.85}
/* hud */
#hud{position:fixed;left:8px;top:8px;z-index:10;display:flex;gap:6px;align-items:center}
.pill{background:rgba(255,248,251,.92);border:2px solid var(--line);padding:2px 9px;font-size:12px;font-weight:700;box-shadow:2px 2px 0 rgba(59,42,51,.25)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3cc46a;margin-right:5px}
#zoneBanner{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:11;background:rgba(255,248,251,.95);border:2px solid var(--line);padding:6px 18px;font-weight:700;font-size:16px;box-shadow:var(--sh);opacity:0;transition:opacity .4s;pointer-events:none;text-align:center}
#zoneBanner small{display:block;font-weight:400;font-size:11px;opacity:.7}
#zoneBanner.on{opacity:1}
#icons{position:fixed;right:10px;top:10px;z-index:10;display:flex;flex-direction:column;gap:12px;align-items:center}
.icon{width:62px;text-align:center;font-size:11px;cursor:pointer;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.icon b{display:block;font-size:24px;line-height:30px}
.pxi{display:block;width:48px;height:48px;margin:0 auto 2px;image-rendering:pixelated;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.3));transition:transform .12s}
.icon:hover .pxi{transform:translateY(-2px) scale(1.06)}
.icon{padding:3px 2px;border:1px dashed transparent}.icon:hover{border-color:rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
#minimap{position:fixed;left:8px;bottom:44px;z-index:10;border:2px solid var(--line);background:#5ab4e5;image-rendering:pixelated;box-shadow:2px 2px 0 rgba(59,42,51,.25)}
#nearby{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:12;min-width:190px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);font-size:12px}
#nearby .tbar{cursor:default;font-size:11px;padding:2px 6px}
#nearby .nb{padding:6px 10px;display:flex;align-items:center;gap:8px;justify-content:center}
#hint{position:fixed;right:10px;bottom:44px;z-index:10;transition:opacity 1s}
#queue{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:12;font-size:12px;padding:6px 10px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex;gap:10px;align-items:center}
/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:30;background:#efe6ea;border-top:2px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 4px}
#startBtn{font-weight:700;padding:2px 10px}
#tabs{flex:1;display:flex;gap:4px;overflow:hidden}
.tab{display:flex;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;padding:1px 6px;font-size:12px;cursor:pointer;max-width:150px;white-space:nowrap}
.tab.act{background:#ffe0ec}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .bd{background:#e0457b;color:#fff;border-radius:8px;font-size:10px;padding:0 5px;font-weight:700}
.tab .x{opacity:.6;padding:0 2px}
.tab.ended .nm{text-decoration:line-through;opacity:.6}
#clock{border:2px inset #d9cdd3;padding:1px 8px;font-size:12px;background:#f7f1f4}
#startMenu{position:fixed;left:4px;bottom:36px;z-index:40;width:200px;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);display:flex}
#startMenu .side{writing-mode:vertical-rl;transform:rotate(180deg);background:linear-gradient(var(--pink2),var(--lav));color:#fff;font-weight:700;padding:6px 3px;font-size:13px;letter-spacing:2px}
#startMenu .items{flex:1}
#startMenu .it{padding:7px 10px;cursor:pointer;font-size:13px}
#startMenu .it:hover{background:#ffe0ec}
/* chat */
.chatwin{width:320px;height:440px}
.heads{display:flex;border-bottom:2px solid var(--line)}
.hd{flex:1;display:flex;gap:6px;padding:6px;align-items:flex-start;min-width:0}
.hd.me{background:#fff6cf}.hd.them{background:#d9f3ea;border-left:2px solid var(--line)}
.hd canvas{width:33px;height:38px;image-rendering:pixelated;border:2px solid var(--line);background:#fff;flex:none}
.hd small{font-size:10px;opacity:.75;display:block}
.hd p{margin:0;font-size:12px;font-style:italic;word-break:break-all;line-height:1.25}
.on{color:#27a457;font-style:normal}.off{color:#999;font-style:normal}
.msgs{flex:1;overflow-y:auto;padding:8px;background:#fff;display:flex;flex-direction:column;gap:6px;user-select:text}
.sys{text-align:center;font-size:11px;opacity:.6}
.mrow{display:flex;gap:6px;align-items:flex-end}
.mrow.mine{flex-direction:row-reverse}
.mrow canvas{width:22px;height:25px;image-rendering:pixelated;flex:none}
.bub{max-width:100%;width:fit-content;padding:4px 9px;border:2px solid var(--line);background:#e5f6ef;word-break:break-word;font-size:13px}
.mine .bub{background:#d8e6ff}
.bub.heart{border:0;background:none;font-size:30px;padding:0;animation:pop .5s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.mname{font-size:10px;opacity:.6;margin-bottom:1px}
.typing .bub{opacity:.6}
.bar{display:flex;gap:4px;padding:6px;border-top:2px solid var(--line);background:#fde9f1}
.bar input{flex:1;min-width:0;border:2px solid var(--line);padding:4px 6px;outline:none}
.bar .hb{border:2px solid var(--line);background:#fff;cursor:pointer;padding:0 6px}
/* toasts */
#toasts{position:fixed;top:44px;right:10px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);padding:6px 12px;font-size:13px;animation:tin .25s;display:flex;gap:8px;align-items:center;max-width:300px}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
/* letters, wall */
.lwin{width:360px;height:440px}
.tabsrow{display:flex;border-bottom:2px solid var(--line)}
.tabsrow button{flex:1;border:0;background:#f4eef1;padding:6px;cursor:pointer;font-size:12px}
.tabsrow button.on{background:#fff;font-weight:700}
.tabsrow button+button{border-left:2px solid var(--line)}
.scroll{flex:1;overflow-y:auto;background:#fff}
.li{padding:8px 10px;border-bottom:1px dashed #d8c6cf;cursor:pointer}
.li:hover{background:#fff4f8}
.li .meta{font-size:11px;opacity:.6}
.li.unread .meta:before{content:"● ";color:#e0457b}
.post{margin:8px;padding:8px 10px;background:#fff9c9;border:2px solid var(--line);box-shadow:2px 2px 0 rgba(59,42,51,.2);font-size:13px}
.post:nth-child(3n+2){background:#d9f3ea;transform:rotate(.6deg)}.post:nth-child(3n){background:#ffe0ec;transform:rotate(-.6deg)}
.post .meta{font-size:11px;opacity:.6;margin-top:3px}
.cnt{font-size:11px;opacity:.6;text-align:right}
/* race */
.racewin{width:680px}
.racewin canvas{display:block;width:100%;image-rendering:pixelated;background:#8fd16a}
.rinfo{padding:8px 10px;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* dpad */
#dpad{position:fixed;left:14px;bottom:52px;z-index:15;display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px;opacity:.75}
#dpad button{border:2px solid var(--line);background:rgba(255,248,251,.85);font-size:18px;touch-action:none}
.modal{z-index:70}
#raceHud{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:12;background:var(--paper);border:2px solid var(--line);box-shadow:var(--sh);padding:6px 12px;font-size:12px;min-width:280px;text-align:center}
#raceHud ol{margin:5px 0;padding:0;list-style:none;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#raceHud li{border:1.5px solid var(--line);padding:0 6px;background:#fff}
#raceHud li.me{background:#ffe0ec;font-weight:700}
.rh-hint{opacity:.65;font-size:11px}
#bigText{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:45;font-size:76px;font-weight:900;color:#d9488f;text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(59,42,51,.3);pointer-events:none;animation:pop .4s}
#ceremony{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:41;background:linear-gradient(#fff8e1,#ffe9f2);border:3px solid var(--line);box-shadow:var(--sh);padding:10px 18px;min-width:320px;max-width:calc(100vw - 20px)}
.cer-t{font-weight:900;font-size:17px;text-align:center;margin-bottom:6px;letter-spacing:1px}
.cer-row{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px;flex-wrap:wrap}
.cer-row .md{font-size:22px}
.cer-row .pr{opacity:.75;font-size:12px}
.cer-row.r1 b{font-size:17px;color:#b07800}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="tint"></div>

<!-- LOGIN -->
<div id="login">
  <div class="win">
    <div class="tbar" style="cursor:default"><span class="ti">✦ 夜語島 · 連線中</span></div>
    <div class="body">
      <h1>夜語島</h1>
      <div class="sub">Night Murmur Island · 曼谷 · 釜山 · 東京 · 河內</div>
      <label class="f">名稱 Name</label>
      <input class="t" id="inName" maxlength="20" placeholder="最多8個中文字 / 20個英文字">
      <label class="f">此刻諗緊… What's on your mind</label>
      <textarea class="t" id="inThought" maxlength="40" placeholder="有咩想同陌生人講？"></textarea>
      <label class="f">性別</label>
      <div class="seg" id="segG"><button data-g="m" class="on">♂ 男</button><button data-g="f">♀ 女</button></div>
      <label class="f">出發地 Start zone</label>
      <select class="t" id="inZone"><option value="hub">🏁 中央廣場</option><option value="bkk">🛕 曼谷 Bangkok</option><option value="pus">🌊 釜山 Busan</option><option value="tyo">⛩️ 東京 Tokyo</option><option value="han">🏮 河內 Hanoi</option></select>
      <div class="err" id="loginErr"></div>
      <button class="btn pri" id="goBtn" style="width:100%">登島 ▶</button>
      <div style="font-size:11px;opacity:.6;text-align:center;margin-top:6px">揀一隻動物 ↓ · 本機遊戲 · 資料只存喺你部機</div>
    </div>
  </div>
  <div id="animals"></div>
</div>

<!-- HUD -->
<div id="hud" class="hidden"><span class="pill"><span class="dot"></span><span id="pcount">-</span></span><span class="pill" id="zonePill">-</span><span class="pill" id="netPill">💻 單機</span></div>
<div id="zoneBanner"></div>
<div id="icons" class="hidden">
  <div class="icon" id="icLetters"><canvas class="pxi" data-i="letter" width="24" height="24"></canvas>feel.txt</div>
  <div class="icon" id="icWall"><canvas class="pxi" data-i="wall" width="24" height="24"></canvas>留言牆</div>
  <div class="icon" id="icRace"><canvas class="pxi" data-i="maze" width="24" height="24"></canvas>迷宮賽跑</div>
  <div class="icon" id="icTp"><canvas class="pxi" data-i="globe" width="24" height="24"></canvas>傳送</div>
</div>
<canvas id="minimap" class="hidden" width="168" height="120"></canvas>
<div id="nearby" class="hidden"><div class="tbar"><span class="ti">Nearby</span></div><div class="nb" id="nbBody">再行近啲…</div></div>
<div id="hint" class="pill hidden">方向鍵行路 → 行近島民 → 撳「連接」開始傾偈！</div>
<div id="queue" class="hidden"></div>
<div id="raceHud" class="hidden"></div>
<div id="bigText" class="hidden"></div>
<div id="ceremony" class="hidden"></div>
<div id="toasts"></div>
<div id="dpad" class="hidden"><span></span><button data-k="ArrowUp">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="Enter" style="font-size:12px">OK</button><button data-k="ArrowRight">▶</button><span></span><button data-k="ArrowDown">▼</button><span></span></div>

<div id="taskbar" class="hidden">
  <button class="btn" id="startBtn">⊞ 開始</button>
  <div id="tabs"></div>
  <span id="clock">--:--</span>
</div>
<div id="startMenu" class="hidden">
  <div class="side">夜語島 v1</div>
  <div class="items">
    <div class="it" data-a="thought">💭 改想法</div>
    <div class="it" data-a="letters">✉ 信件</div>
    <div class="it" data-a="wall">📌 留言牆</div>
    <div class="it" data-a="race">🌀 迷宮賽跑</div>
    <div class="it" data-a="tp">🧭 傳送去其他城市</div>
    <div class="it" data-a="online">🌐 同朋友線上玩</div>
    <div class="it" data-a="sound">🔊 聲音：開</div>
    <div class="it" data-a="leave">🚪 離開島嶼</div>
  </div>
</div>

<script>
'use strict';
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,(a,b,cw,ch,col)=>{x.fillStyle=col;x.fillRect(a|0,b|0,cw|0,ch|0)});return c}

/* ================= sound ================= */
let soundOn=store.get('ni_sound',true),actx=null;
function blip(f=660,d=.08,type='square',v=.04){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.stop(actx.currentTime+d)}catch(e){}}

/* ================= animals ================= */
const ANIMALS={
 bear:{n:'熊',h:'#b0703f',m:'#ecc9a0',b:'#e46f6f',ear:'bear'},
 cat:{n:'貓',h:'#f5f1ea',m:'#f6b8c8',b:'#7fb6e8',ear:'cat'},
 chick:{n:'雞',h:'#f7d54a',m:'#fff2b0',b:'#8fd16a',ear:'tuft',e2:'#f08a24'},
 pup:{n:'狗',h:'#dcae74',m:'#f6e3c8',b:'#f2b84b',ear:'flop',e2:'#8a5a34'},
 bunny:{n:'兔',h:'#ffffff',m:'#f7c6d4',b:'#b39ddb',ear:'bunny'},
 fox:{n:'狐',h:'#ee8a3a',m:'#fff3e3',b:'#4db6ac',ear:'fox'},
 panda:{n:'熊貓',h:'#ffffff',m:'#ffffff',b:'#7cc7a0',ear:'panda'}
};
const AKEYS=Object.keys(ANIMALS);
function shade(h,f){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,q=Math.abs(f);r=Math.round((t-r)*q+r);g=Math.round((t-g)*q+g);b=Math.round((t-b)*q+b);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
const SW=22,SH=25;
function makeAnimal(a,f){
 const W=SW,H=SH,g=new Array(W*H).fill(null);
 const P=(x,y,c)=>{x|=0;y|=0;if(x>=0&&y>=0&&x<W&&y<H)g[y*W+x]=c};
 const E=(cx,cy,rx,ry,c,sh)=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1){let col=c;if(sh){if(dx*.5+dy>.62)col=shade(c,-.17);else if(dx*.7+dy<-.78)col=shade(c,.38)}P(x,y,col)}}};
 const Rr=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(x+i,y+j,c)};
 const triEar=(x0,dir,top,h,c,inner,tip)=>{for(let k=0;k<h;k++){const w=1+Math.floor(k*0.75);for(let i=0;i<w;i++){const x=dir>0?x0+i:x0-i;P(x,top+k,(k===0&&tip)?tip:(i>0&&i<w-1&&k>1&&inner)?inner:c)}}};
 const D='#2a1a22',hc=a.h,mc=a.m,bc=a.b,e2=a.e2||shade(hc,-.25);
 const armY=f===1?18:f===3?20:19,armY2=f===1?20:f===3?18:19;
 // tails (behind)
 if(a.ear==='fox'){E(18.5,19.5,2.6,3.6,hc,1);E(19.2,16.6,1.5,1.4,'#fff7ee')}

try{NET.bc=new BroadcastChannel('night-island-v1');NET.bc.onmessage=e=>{if(!NET.room&&!wsOpen())onNet(e.data)}}catch(e){}
// self-hosted server mode (server.js): page served over http(s) by our own server
function wsConnect(){if(!/^https?:$/.test(location.protocol)||window.claude||NET.room)return;let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(e){return}
 ws.onopen=()=>{NET.ws=ws;NET.lastSent='';if(inWorld&&me)bcPost({t:'hello'})};
 ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}if(!d||typeof d!=='object')return;
  if(d.k==='st'&&d.st)onState({...d.st,from:d.st.id});else if(d.k==='g'&&d.m)onNet(d.m);
  else if(d.k==='wall'&&Array.isArray(d.list)){wall=d.list.map(q=>({n:clean(q.n,20),t:clean(q.t,100),z:ZONES[q.z]?q.z:'hub',time:+q.time||0}));if(wallWin)renderWall()}
  else if(d.k==='full')toast(`⚠ 伺服器已滿（${d.max|0} 人），遲啲再試`,null,null,8000)};
 ws.onerror=()=>{};
 ws.onclose=()=>{const was=NET.ws===ws;NET.ws=null;if(was){for(const id of[...remotes.keys()])onNet({t:'leave',from:id});toast('⚠ 同伺服器斷咗線，重新連線中…')}setTimeout(wsConnect,3000)}}
setTimeout(wsConnect,0);
const wsOpen=()=>NET.ws&&NET.ws.readyState===1;
function bcPost(m){if(!me)return;m.from=me.id;if(NET.room){NET.room.emit('g',m).catch(()=>{});return}if(wsOpen()){NET.ws.send(JSON.stringify({k:'g',m}));return}if(NET.bc){try{NET.bc.postMessage(m)}catch(e){}}}
function myState(){return{t:'st',id:me.id,name:me.name,thought:me.thought,gender:me.gender,animal:me.animal,x:Math.round(me.x*2)/2,y:Math.round(me.y*2)/2,dir:me.dir,moving:!!me.moving,pod:me.podium||0,medal:me.medal||'',slip:me.stun>0?1:0,racing:me.racing?1:0,q:me.q||0,hb:Math.floor(Date.now()/2000)}}
function onState(m){const id=clean(m.from||m.id,40);if(!id||!me||id===me.id)return;const x=+m.x,y=+m.y;if(!isFinite(x)||!isFinite(y))return;
 let r=remotes.get(id);if(!r){r={id,kind:'remote',alpha:0,anim:0,x,y};remotes.set(id,r)}
 if(Math.hypot(r.x-x,r.y-y)>140){r.x=x;r.y=y}
 Object.assign(r,{name:clean(m.name,20)||'旅人',thought:clean(m.thought,40),gender:m.gender==='f'?'f':'m',animal:AKEYS.includes(m.animal)?m.animal:'bear',tx:x,ty:y,dir:m.dir<0?-1:1,moving:!!m.moving,podium:[1,2,3].includes(m.pod)?m.pod:0,medal:['🥇','🥈','🥉'].includes(m.medal)?m.medal:'',slipping:!!m.slip,racing:!!m.racing,q:+m.q||0,seen:performance.now()});
 const c=chats.get(r.id);if(c)updateChatHead(c)}
function onNet(m){if(!inWorld||!me||!m||typeof m!=='object')return;const from=clean(m.from,40);if(!from||from===me.id)return;if(m.to&&m.to!==me.id)return;
 const r=remotes.get(from);
 switch(m.t){
  case'hello':bcPost(myState());break;
  case'st':onState(m);break;
  case'leave':if(r){remotes.delete(from);const c=chats.get(from);if(c)endChat(c,'— 佢已經離開咗島 —')}break;
  case'req':if(!r||chats.has(r.id))return;if(openCount()>=cap()){bcPost({t:'busy',to:from});return}{const c=openChat(r,{incoming:true});if(c)notifyIncoming(c)}break;
  case'busy':{const c=chats.get(from);if(c){removeChat(c);toast(`⚠ ${esc(r?r.name:'對方')} 已經同緊人傾偈，傾唔到`)}}break;
  case'msg':{if(!r)return;let c=chats.get(r.id);if(!c){if(openCount()>=cap())return;c=openChat(r,{incoming:true});if(!c)return;notifyIncoming(c)}addMsg(c,'them',clean(m.text,200));break}
  case'close':{const c=chats.get(from);if(c)endChat(c,'— 對方已離開對話 —')}break;
  case'wall':wall=store.get('ni_wall',wall);if(wallWin)renderWall();break;
  case'wallpost':if(!NET.db&&m.post){const q=m.post;wall.unshift({n:clean(q.n,20),t:clean(q.t,100),z:ZONES[q.z]?q.z:'hub',time:Date.now()});wall=wall.slice(0,80);if(wallWin)renderWall()}break;
  case'rstart':onRaceStart(m);break;
  case'rban':{const s=race.st;if(s&&s.online&&s.bananas[m.i|0])s.bananas[m.i|0].gone=true}break;
  case'rfin':{const s=race.st;if(!s||!s.online)break;const rr=s.racers.find(x=>x.e.id===from);if(rr&&!rr.done){rr.done=true;s.finish.push(rr);rr.rank=s.finish.length;if(rr.rank===1)s.firstT=s.time;toast(`🏁 ${esc(rr.e.name)} 衝出迷宮！第 ${rr.rank} 名`)}}break;
  case'rend':{const s=race.st;if(s&&s.online&&s.phase==='run'&&Array.isArray(m.order))startCeremony(m.order.slice(0,4).map(x=>clean(x,40)))}break;
 }}
function syncPeers(){if(!NET.room)return;for(const p of NET.room.peers()){if(p.sameTab)continue;const st=p.presence&&p.presence.st;if(st&&typeof st==='object'&&st.id){NET.peerIds.set(p.peer,String(st.id));onState({...st,from:st.id})}}}
function netLabel(){const real=1+remotes.size;return(NET.room||wsOpen())?`🌐 線上 · 真人 ${real}`:(remotes.size?`💻 本機多分頁 · ${real}`:'💻 單機')}
(async()=>{try{if(!window.claude||typeof claude.use!=='function')return;const room=await claude.use('room');if(!room)return;NET.room=room;
 room.on('g',msg=>{if(msg.sameTab)return;const d=msg.data;if(d&&typeof d==='object')onNet(d)},()=>{});
 room.onPeers(ch=>{for(const p of[...ch.joined,...ch.updated]){if(p.sameTab)continue;const st=p.presence&&p.presence.st;
   if(st&&typeof st==='object'&&st.id){NET.peerIds.set(p.peer,String(st.id));onState({...st,from:st.id})}
   else if(NET.peerIds.has(p.peer)){const id=NET.peerIds.get(p.peer);NET.peerIds.delete(p.peer);onNet({t:'leave',from:id})}}
  for(const p of ch.left){const id=NET.peerIds.get(p.peer);if(id){NET.peerIds.delete(p.peer);onNet({t:'leave',from:id})}}},()=>{});
 if(inWorld)syncPeers();
 const db=await claude.use('db');if(db){NET.db=db;try{db.collection('wall').orderBy('time','desc').limit(80).onSnapshot(snap=>{wall=snap.docs.map(d=>d.data()).filter(Boolean).map(d=>({n:clean(d.n,20),t:clean(d.t,100),z:ZONES[d.z]?d.z:'hub',time:+d.time||0}));if(wallWin)renderWall()},()=>{NET.db=null})}catch(e){NET.db=null}}
}catch(e){}})();
setInterval(()=>{if(!inWorld||!me)return;const st=myState();if(NET.room||wsOpen()){const k=JSON.stringify(st);if(k!==NET.lastSent){NET.lastSent=k;if(NET.room)NET.room.presence({st}).catch(()=>{});else NET.ws.send(JSON.stringify({k:'st',st}))}}else bcPost(st)},110);
addEventListener('beforeunload',()=>{if(inWorld)bcPost({t:'leave'})});

/* ================= toasts ================= */
function toast(html,btn,fn,ms=3800){const t=el('div','toast',html);if(btn){const b=el('button','btn pink',btn);b.style.padding='1px 8px';b.onclick=()=>{fn();t.remove()};t.appendChild(b)}$('#toasts').appendChild(t);setTimeout(()=>t.remove(),ms);return t}

/* ================= windows ================= */
function makeWin(cls,title,w){const win=el('div','win '+cls);win.innerHTML=`<div class="tbar"><span class="ti">${title}</span><button class="tbtn mn">_</button><button class="tbtn cl">✕</button></div>`;document.body.appendChild(win);
 const n=document.querySelectorAll('.win:not(.hidden)').length;const W=Math.min(w||320,innerWidth-16);win.style.left=Math.max(8,Math.min(innerWidth-W-8,innerWidth/2-W/2+(n%5)*26-40))+'px';win.style.top=Math.max(8,Math.min(innerHeight-480,60+(n%5)*22))+'px';
 drag(win,$('.tbar',win));win.addEventListener('pointerdown',()=>front(win));front(win);return win}
function front(w){w.style.zIndex=++zTop}
function drag(win,bar){let sx,sy,ox,oy,on=false;bar.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;on=true;sx=e.clientX;sy=e.clientY;ox=win.offsetLeft;oy=win.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!on)return;win.style.left=Math.max(-200,Math.min(innerWidth-60,ox+e.clientX-sx))+'px';win.style.top=Math.max(0,Math.min(innerHeight-60,oy+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>on=false)}
function confirmBox(text,okLabel,fn){const w=makeWin('modal','⚠ 確認',300);w.style.width='300px';w.classList.add('modal');w.style.zIndex=999;const b=el('div','body',`<div style="margin-bottom:12px">${text}</div>`);const row=el('div','',null);row.style.cssText='display:flex;gap:8px;justify-content:flex-end';const c=el('button','btn','取消'),o=el('button','btn pink',okLabel);c.onclick=()=>w.remove();o.onclick=()=>{w.remove();fn()};row.append(c,o);b.appendChild(row);w.appendChild(b);$('.mn',w).remove();$('.cl',w).onclick=()=>w.remove()}
function promptBox(title,label,val,max,fn){const w=makeWin('modal',title,300);w.style.width='300px';w.style.zIndex=999;const b=el('div','body',`<label class="f">${label}</label>`);const i=el('input','t');i.maxLength=max;i.value=val;const row=el('div','');row.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:10px';const c=el('button','btn','取消'),o=el('button','btn pri','確定');c.onclick=()=>w.remove();const go=()=>{const v=i.value.trim();if(!v)return;w.remove();fn(v)};o.onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()};row.append(c,o);b.append(i,row);w.appendChild(b);$('.mn',w).remove();$('.cl',w).onclick=()=>w.remove();setTimeout(()=>i.focus(),30)}

/* ================= chat ================= */
const cap=()=>2+(extra?1:0);
function openCount(){let n=0;for(const c of chats.values())if(!c.ended)n++;return n}
function openChat(ent,o={}){
 if(chats.has(ent.id)){showChat(chats.get(ent.id));return chats.get(ent.id)}
 if(openCount()>=cap()){toast(`⚠ 最多同時同 ${cap()} 個人傾偈，請先閂咗一個`);return null}
 if(ent.kind==='bot'&&ent.busy&&!o.incoming){toast(`⚠ ${esc(ent.name)} 已經同緊兩個人傾偈`);return null}
 if(openCount()===2&&extra)extraInUse=true;
 const win=makeWin('chatwin',`${ANIMALS[ent.animal].n}・${esc(ent.name)}`,320);
 win.insertAdjacentHTML('beforeend',`<div class="heads"><div class="hd me"></div><div class="hd them"></div></div><div class="msgs"><div class="sys">— ${esc(ent.name)} · ${ZONES[zoneAt(ent.x,ent.y)].icon} ${ZONES[zoneAt(ent.x,ent.y)].name} —</div></div><div class="bar"><button class="hb" title="送心心">❤️</button><input maxlength="200" placeholder="講啲嘢… Enter 發送"><button class="btn pri" style="padding:2px 10px">發送</button></div>`);
 const c={ent,win,msgs:$('.msgs',win),input:$('input',win),unread:0,min:false,ended:false,botSent:0};
 const tab=el('div','tab');tab.innerHTML=`<span>${ANIMALS[ent.animal].n}</span><span class="nm">${esc(ent.name)}</span><span class="bd hidden"></span><span class="x">✕</span>`;$('#tabs').appendChild(tab);c.tab=tab;
 tab.onclick=e=>{if(e.target.classList.contains('x')){closeChat(c);return}if(c.min||activeChat!==c)showChat(c);else minChat(c)};
 $('.mn',win).onclick=()=>minChat(c);$('.cl',win).onclick=()=>closeChat(c);
 const send=()=>{const v=c.input.value.trim();if(!v||c.ended)return;c.input.value='';sendMsg(c,v)};
 c.input.addEventListener('keydown',e=>{if(e.key==='Enter'){send();e.preventDefault()}});
 $('.bar .btn',win).onclick=send;$('.hb',win).onclick=()=>{if(!c.ended)sendMsg(c,'❤️')};
 win.addEventListener('pointerdown',()=>{activeChat=c;markTabs()});
 chats.set(ent.id,c);updateChatHead(c);
 if(ent.kind==='remote'&&!o.incoming)bcPost({t:'req',to:ent.id});
 if(o.incoming){c.min=true;win.classList.add('hidden')}else{activeChat=c;setTimeout(()=>c.input.focus(),30)}
 markTabs();updateTint();blip(660,.06);return c}
function updateChatHead(c){const e=c.ent;const mh=$('.hd.me',c.win),th=$('.hd.them',c.win);
 mh.innerHTML='';mh.appendChild(avatarCanvas(me.animal));mh.insertAdjacentHTML('beforeend',`<div><small>我</small><p>${esc(me.thought)}</p></div>`);
 th.innerHTML='';th.appendChild(avatarCanvas(e.animal));th.insertAdjacentHTML('beforeend',`<div><small>${e.gender==='f'?'佢 ♀':'佢 ♂'} ${c.ended?'<i class="off">● 離線</i>':'<i class="on">● 在線</i>'}</small><p>${esc(e.thought)}</p></div>`)}
function addMsg(c,who,text,o={}){
 const row=el('div','mrow'+(who==='me'?' mine':''));row.appendChild(avatarCanvas(who==='me'?me.animal:c.ent.animal));
 const col=el('div','');col.style.cssText='display:flex;flex-direction:column;align-items:'+(who==='me'?'flex-end':'flex-start')+';max-width:80%';
 col.innerHTML=`<div class="mname">${esc(who==='me'?me.name:c.ent.name)} · ${hhmm(new Date())}</div><div class="bub${/^❤️$/.test(text)?' heart':''}">${esc(text)}</div>`;row.appendChild(col);
 c.msgs.appendChild(row);c.msgs.scrollTop=c.msgs.scrollHeight;
 if(who!=='me'){if(c.min||activeChat!==c){c.unread++;markTabs()}blip(990,.06,'triangle',.05)}}
function sendMsg(c,text){addMsg(c,'me',text);if(c.ent.kind==='remote')bcPost({t:'msg',to:c.ent.id,text});else botRespond(c,text)}
function showChat(c){c.min=false;c.win.classList.remove('hidden');front(c.win);activeChat=c;c.unread=0;markTabs();updateTint();setTimeout(()=>c.input.focus(),20)}
function minChat(c){c.min=true;c.win.classList.add('hidden');if(activeChat===c)activeChat=[...chats.values()].find(x=>!x.min)||null;c.input.blur();markTabs();updateTint()}
function markTabs(){for(const c of chats.values()){c.tab.classList.toggle('act',c===activeChat&&!c.min);c.tab.classList.toggle('ended',c.ended);const bd=$('.bd',c.tab);bd.textContent=c.unread;bd.classList.toggle('hidden',!c.unread)}}
function updateTint(){$('#tint').classList.toggle('on',[...chats.values()].some(c=>!c.min))}
function closeChat(c){if(c.ended){removeChat(c);return}confirmBox('你確定要離開呢個對話？<br>離開之後就永遠退出呢個聊天室，訊息都會消失。','離開對話',()=>{if(c.ent.kind==='remote')bcPost({t:'close',to:c.ent.id});removeChat(c)})}
function removeChat(c){c.win.remove();c.tab.remove();chats.delete(c.ent.id);if(activeChat===c)activeChat=null;clearTimeout(c.timer);markTabs();updateTint();
 if(extraInUse&&openCount()<=2){extra=0;extraInUse=false;toast('已用咗額外對話，上限返回 2 個')}}
function endChat(c,msg){if(c.ended)return;c.ended=true;c.msgs.appendChild(el('div','sys',esc(msg)));c.msgs.scrollTop=1e9;c.input.disabled=true;c.input.placeholder='對話已結束';updateChatHead(c);markTabs();
 if(extraInUse&&openCount()<=2){extra=0;extraInUse=false;toast('已用咗額外對話，上限返回 2 個')}}
function notifyIncoming(c){toast(`💬 <b>${esc(c.ent.name)}</b> 向你發送訊息！`,'查看',()=>showChat(c),7000);blip(880,.08);setTimeout(()=>blip(1175,.1),100)}

/* bot brain */
function botLine(c,text){const t=text.toLowerCase();
 if(/❤|心心|love/.test(text))return pick(BRAIN.heart);
 if(/跑|run|race|比賽|賽跑|迷宮|maze/.test(t)){c.ent.wantsRace=true;return pick(BRAIN.run)}
 if(c.botSent===0&&/(^|\s)(hi+|hello|hey|yo|哈囉|嗨|你好|hihi)/.test(t))return pick(BRAIN.greet);
 if(/(bye|拜拜|晚安|走先)/.test(t)){c.leaving=true;return pick(BRAIN.bye)}
 if(/[?？]|咩|點|邊|乜|嗎|未|唔/.test(text))return pick(BRAIN.q);
 return pick(BRAIN.generic)}
function botRespond(c,text){if(c.ended)return;clearTimeout(c.timer);
 c.timer=setTimeout(()=>{if(c.ended||!chats.has(c.ent.id))return;
  const ty=el('div','mrow typing');ty.appendChild(avatarCanvas(c.ent.animal));ty.appendChild(el('div','bub','…'));c.msgs.appendChild(ty);c.msgs.scrollTop=1e9;
  setTimeout(()=>{ty.remove();if(c.ended||!chats.has(c.ent.id))return;const line=botLine(c,text);addMsg(c,'them',line);c.botSent++;
   if(c.ent.wantsRace){c.ent.wantsRace=false;botJoinQueue(c.ent)}
   if(c.leaving||c.botSent>=c.ent.byeAt){if(!c.leaving)setTimeout(()=>addMsg(c,'them',pick(BRAIN.bye)),1500);setTimeout(()=>endChat(c,'— 對方已離開對話 —'),3500);return}
   if(Math.random()<.35)setTimeout(()=>{if(!c.ended&&chats.has(c.ent.id)){addMsg(c,'them',pick(BRAIN.ask).replace('{z}',ZONES[pick(['bkk','pus','tyo','han'])].name));c.botSent++}},rand(2500,5000));
  },rand(900,2600));
 },rand(500,1500))}

/* ================= bot events ================= */
let botTimers=[];
function scheduleBotEvents(){botTimers.forEach(clearTimeout);botTimers=[];
 const incoming=()=>{botTimers.push(setTimeout(()=>{if(inWorld&&!race.st&&openCount()<cap()){const cand=bots.filter(b=>!chats.has(b.id)&&!b.busy&&b.alpha>=1);if(cand.length){const b=pick(cand);const c=openChat(b,{incoming:true});if(c){addMsg(c,'them',pick(BRAIN.open));c.botSent=1;notifyIncoming(c)}}}incoming()},rand(45000,95000)))};
 const churn=()=>{botTimers.push(setTimeout(()=>{if(inWorld){const free=bots.filter(b=>!chats.has(b.id)&&!race.queue.includes(b)&&!b.racing&&!b.podium&&!b.cheer&&!b.watch);if(free.length&&Math.random()<.5&&bots.length>12){const b=pick(free);b.leaving=true}if(bots.length<20&&Math.random()<.6){const b=newBot();b.alpha=0}}churn()},rand(30000,60000)))};
 const mail=()=>{botTimers.push(setTimeout(()=>{if(inWorld)receiveLetter(pick(NAMES),pick(LETTERS));mail()},rand(90000,200000)))};
 incoming();churn();mail();
 botTimers.push(setTimeout(()=>{if(inWorld)receiveLetter(pick(NAMES),pick(LETTERS))},rand(25000,45000)));
}

/* ================= letters ================= */
let letWin=null,letTab='in';
function receiveLetter(from,text,isReply){letters.unshift({id:Date.now()+''+ri(0,999),from,text,time:Date.now(),read:false,reply:!!isReply});letters=letters.slice(0,40);store.set('ni_letters',letters);toast('💌 你收到一封信',isReply?'睇回信':'查看',()=>openLetters('in'),7000);blip(1046,.12,'triangle',.05);if(letWin&&letTab==='in')renderLetters()}
function openLetters(tab='in'){letTab=tab;if(letWin){letWin.classList.remove('hidden');front(letWin);renderLetters();return}
 letWin=makeWin('lwin','✉ 信件 · feel.txt',360);letWin.insertAdjacentHTML('beforeend','<div class="tabsrow"><button data-t="in">📥 收件箱</button><button data-t="new">✏ 寄封信畀陌生人</button></div><div class="scroll"></div>');
 letWin.querySelectorAll('.tabsrow button').forEach(b=>b.onclick=()=>{letTab=b.dataset.t;renderLetters()});
 $('.cl',letWin).onclick=()=>{letWin.remove();letWin=null};$('.mn',letWin).onclick=()=>letWin.classList.add('hidden');renderLetters()}
function renderLetters(replyTo){const sc=$('.scroll',letWin);letWin.querySelectorAll('.tabsrow button').forEach(b=>b.classList.toggle('on',b.dataset.t===letTab||(letTab==='read'&&b.dataset.t==='in')));

 else if(letTab==='new'){sc.innerHTML=`<div class="body">${replyTo?`<div style="font-size:12px;margin-bottom:6px">回信畀：<b>${esc(replyTo)}</b></div>`:'<div style="font-size:12px;margin-bottom:6px;opacity:.7">封信會隨機寄畀島上一位陌生人</div>'}<textarea class="t" maxlength="100" placeholder="寫啲嘢…100字以內" style="height:140px"></textarea><div class="cnt">0/100</div><div class="err"></div><button class="btn pri" style="width:100%">寄出 ✉</button></div>`;
